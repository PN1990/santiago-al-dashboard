name: Importar Reservas Talkguest

on:
  schedule:
    # Corrida principal: todos os dias às 7h UTC (8h/9h em Portugal).
    - cron: '0 7 * * *'
    # Rede de segurança: se a corrida da manhã falhar (tipicamente o 2FA),
    # esta repete o trabalho ao meio-dia. A importação é idempotente —
    # substitui sempre a lista completa de reservas — por isso correr duas
    # vezes no mesmo dia não duplica nada.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  importar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Instalar dependências Python
        run: pip install selenium openpyxl requests

      - name: Correr bot de importação
        env:
          TALKGUEST_EMAIL:    ${{ secrets.TALKGUEST_EMAIL }}
          TALKGUEST_PASSWORD: ${{ secrets.TALKGUEST_PASSWORD }}
          API_URL:            ${{ secrets.API_URL }}
          BOT_SECRET:         ${{ secrets.BOT_SECRET }}
          MAIL_2FA_ADDRESS:   ${{ secrets.MAIL_2FA_ADDRESS }}
          MAIL_2FA_PASSWORD:  ${{ secrets.MAIL_2FA_PASSWORD }}
          MAIL_2FA_IMAP_HOST: ${{ secrets.MAIL_2FA_IMAP_HOST }}
          MAIL_2FA_FOLDER:    ${{ secrets.MAIL_2FA_FOLDER }}
        run: python talkguest_import.py

      # ATENÇÃO (privacidade): este repositório é público e os artifacts de
      # repositórios públicos podem ser descarregados por qualquer pessoa.
      # Os screenshots tirados DEPOIS do login (tg_4*, tg_5*) mostram a lista
      # de reservas com nomes de hóspedes, por isso nunca são publicados.
      # Só se publicam os passos de login/2FA, e só quando a corrida falha.
      - name: Upload screenshots de debug (só em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            /tmp/tg_0*.png
            /tmp/tg_1*.png
            /tmp/tg_3*.png
          if-no-files-found: ignore
